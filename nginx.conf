worker_processes 1;

events { worker_connections 1024; }

http {
  access_log /tmp/nginx.access.log;
  error_log  /tmp/nginx.error.log;
  include       /etc/nginx/mime.types;
  #include       /Users/alexey.nikolayenko/Desktop/Experiments/mail-sender/Sender_App2/cv-sender/mime.types;
  default_type  application/octet-stream;

  server {
    listen 8080;

    # 1. Раздаём фронтенд (статические файлы)
    location / {
      #root   /Users/alexey.nikolayenko/Desktop/Experiments/mail-sender/Sender_App2/cv-sender/frontend;
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    # 2. Проксируем API на Node.js
    location /api/ {
      proxy_pass         http://backend:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}