worker_processes 1;

events { worker_connections 1024; }

http {
  access_log /tmp/nginx.access.log;
  error_log  /tmp/nginx.error.log;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Resolver для отложенного разрешения DNS имен
  resolver 127.0.0.11 valid=30s;

  # Редирект HTTP -> HTTPS
  server {
    listen 8080;
    server_name sender.your_sendgrid_api_key;

    # Для Let's Encrypt верификации (если нужно)
    location /.well-known/acme-challenge/ {
      root /usr/share/nginx/html;
    }

    # Редирект всего остального на HTTPS
    location / {
      return 301 https://$server_name$request_uri;
    }
  }

  # HTTPS сервер
  server {
    listen 8443 ssl;
    http2 on;
    server_name sender.your_sendgrid_api_key;

    # SSL сертификаты (монтируются из хоста)
    ssl_certificate /etc/letsencrypt/live/sender.your_sendgrid_api_key/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sender.your_sendgrid_api_key/privkey.pem;

    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Раздаём фронтенд (статические файлы)
    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    # 2. Проксируем API на Node.js
    location /api/ {
      set $backend http://backend:3000;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}