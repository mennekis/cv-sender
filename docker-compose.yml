services:
   mongodb:
      image: mongo:7
      restart: always
      volumes:
         - mongodb_data:/data/db
      #ports:
      #   - "27017:27017"
      environment:
         - MONGO_INITDB_DATABASE=sender-app
      healthcheck:
         test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 10s

   backend:
      build: ./backend
      restart: always
      env_file:
         - ./backend/.env
      volumes:
         - ./backend/uploads:/usr/src/app/uploads
         - ./backend/logs:/usr/src/app/logs
      expose:
         - "3000"
      environment:
         - NODE_ENV=production
         - MONGO_URI=mongodb://username:password@host:port/database
      depends_on:
         mongodb:
            condition: service_healthy

   nginx:
      image: nginx:alpine
      volumes:
         - ./nginx.conf:/etc/nginx/nginx.conf:ro
         - ./mime.types:/etc/nginx/mime.types:ro
         - ./frontend:/usr/share/nginx/html:ro
         - /etc/letsencrypt:/etc/letsencrypt:ro
      ports:
         - "80:8080"
         - "443:8443"
      depends_on:
         - backend

volumes:
   mongodb_data:
