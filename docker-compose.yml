services:
   backend:
      build: ./backend
      restart: always
      env_file:
         - ./backend/.env
      volumes:
         - ./backend/uploads:/usr/src/app/uploads
         - ./backend/logs:/usr/src/app/logs
      expose:
         - "3000"
      environment:
         - NODE_ENV=production
         - NODE_TLS_REJECT_UNAUTHORIZED=0

   nginx:
      image: nginx:alpine
      volumes:
         - ./nginx.conf:/etc/nginx/nginx.conf:ro
         - ./mime.types:/etc/nginx/mime.types:ro
         - ./frontend:/usr/share/nginx/html:ro
      ports:
         - "80:8080"
      depends_on:
         - backend
